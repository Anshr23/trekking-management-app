{% extends "base.html" %}

{% block title %}Manage Trek{% endblock %}

{% block content %}

<div class="form-container">

    <h2 class="text-center mb-4">
        Manage {{ trek.name }}
    </h2>


    <div class="mb-4">

        <p>
            <strong>Location:</strong>
            {{ trek.location }}
        </p>

        <p>
            <strong>Difficulty:</strong>
            {{ trek.difficulty }}
        </p>

        <p>
            <strong>Start Date:</strong>
            {{ trek.start_date }}
        </p>

        <p>
            <strong>End Date:</strong>
            {{ trek.end_date }}
        </p>

    </div>


    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Available Slots
            </label>

            <input type="number"
                   name="available_slots"
                   class="form-control"
                   min="0"
                   value="{{ trek.available_slots }}"
                   required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Trek Status
            </label>

            <select name="status"
                    class="form-select"
                    required>

                {% for status in ["Pending", "Approved", "Open", "Closed", "Ongoing", "Completed"] %}

                    <option value="{{ status }}"
                        {% if trek.status == status %}
                            selected
                        {% endif %}>

                        {{ status }}

                    </option>

                {% endfor %}

            </select>

        </div>


        <button type="submit"
                class="btn btn-primary w-100">
            Update Trek
        </button>

    </form>


    <a href="{{ url_for('staff_dashboard') }}"
       class="btn btn-secondary w-100 mt-2">
        Back to Dashboard
    </a>

</div>

{% endblock %}
